name: Update PvP dashboard
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - run: |
          git config user.name 'dashboard-bot'
          git config user.email 'dashboard-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Sync zKillboard statistics' && git push)
